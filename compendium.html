<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta property="og:image" content="assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/images/og-image.jpg">
<link rel="icon" type="image/jpeg" href="assets/images/compendium-icon.jpg">
<link rel="apple-touch-icon" href="assets/images/compendium-icon.jpg">
<title>RDR2 图鉴</title>
<link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/compendium.css">


</head>
<body>
<div class="scene-backdrop" aria-hidden="true"><div class="scene-ground"></div><div class="scene-art"><img src="assets/images/rdr2-background.jpg" alt="" width="2000" height="1000"></div></div>
<main class="page">
<aside class="update-ticker" id="update-ticker"><div class="update-ticker-track" aria-hidden="true"><span class="update-ticker-copy"></span><span class="update-ticker-copy"></span></div></aside>
<header class="top">
  <div class="brand"><div class="eyebrow"></div><h1 id="page-title">图鉴</h1></div>
  <div class="top-actions"><a href="index.html" id="back-link">返回</a></div>
</header>
<section class="summary" id="summary" aria-label="总完成度">
  <div class="big" id="overall">0 / 560</div>
  <div class="meter" aria-hidden="true"><i id="overall-bar"></i></div>
</section>
<section class="workspace">
  <nav class="tabs" id="tabs" aria-label="图鉴分类"></nav>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="搜索当前分类…" aria-label="搜索当前分类">
    <div class="segments" id="filters" aria-label="完成状态筛选">
      <button class="active" data-filter="all">全部</button><button data-filter="todo">未完成</button><button data-filter="done">已完成</button>
    </div>
  </div>
  <div id="content"></div>
</section>
<footer class="foot"><p id="source-note"></p><p class="copyright" id="copyright-note"></p></footer>
</main>
<script src="assets/js/updates.js"></script>
<script src="assets/js/compendium.js"></script>
</body>
</html>
